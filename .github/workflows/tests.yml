name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
              numpy pandas scikit-learn matplotlib seaborn lightgbm \
              torch mlflow pyarrow tqdm requests pytest

      - name: Lint imports (smoke check)
        run: |
          python -c "import src.config, src.data, src.features, src.evaluation, src.plotting"
          python -c "from src.models import LightGBMForecaster, LSTMForecaster"

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short
