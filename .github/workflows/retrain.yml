name: retrain-benchmark

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
    inputs:
      models:
        description: "Which models to run (space-separated: persistence, lightgbm, lstm, chronos)"
        required: false
        default: "persistence lightgbm lstm"
  # Run automatically when the pipeline code or feature config changes.
  push:
    branches: [main]
    paths:
      - "src/features.py"
      - "src/models/**"
      - "src/train.py"
      - "src/config.py"
      - "scripts/run_benchmark.py"

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Download dataset
        run: python scripts/download_data.py

      - name: Run benchmark
        run: |
          python scripts/run_benchmark.py             --models ${{ github.event.inputs.models || 'persistence lightgbm lstm' }}             --device cpu

      # Retraining that publishes its artefacts without checking them is how a
      # worse model becomes the new reference.
      - name: Compare against baseline
        id: gate
        continue-on-error: true
        run: |
          python scripts/check_regression.py             --baseline results/tables/baseline_cpu.csv             --candidate results/tables/benchmark_summary.csv             --metric rmse             --tolerance 0.03             --summary-out gate_report.md

      - name: Publish report to the job summary
        if: always()
        run: cat gate_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MLflow runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/
          retention-days: 30

      - name: Upload result figures and tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            gate_report.md
          retention-days: 30

      - name: Fail if any model regressed
        if: steps.gate.outcome == 'failure'
        run: |
          echo "A model regressed past the tolerance. See the job summary." >&2
          exit 1
